name: Android release
# Run by hand from the Actions tab when a build should go to Play. It isn't a PR check and costs nothing on PRs.
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version shown to users, like 1.0.0"
        required: true
        default: "1.0.0"
      releaseNotes:
        description: "What's new, shown to testers (optional)"
        required: false
        default: ""
      playStatus:
        description: "Internal testing release status: completed rolls out to testers; draft waits in Play Console"
        required: true
        default: completed
        type: choice
        options: [completed, draft]

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      # Set once Jake adds the Play service account key; until then builds stop at the artifact.
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "GOOGLE_SERVICES_JSON secret is missing" >&2; exit 1; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      # The upload key lives only in repository secrets; it is written to the runner's temp folder and never committed.
      - name: Add upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then echo "UPLOAD_KEYSTORE_BASE64 secret is missing" >&2; exit 1; fi
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed bundle
        env:
          FEALTY_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          FEALTY_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          FEALTY_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          FEALTY_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: >
          ./gradlew bundleRelease --stacktrace
          -Pfealty.versionCode=${{ github.run_number }}
          -Pfealty.versionName=${{ inputs.versionName }}
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: fealty-release-aab-${{ inputs.versionName }}-${{ github.run_number }}
          path: apps/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Write release notes
        if: env.HAS_PLAY_KEY == 'true' && inputs.releaseNotes != ''
        env:
          NOTES: ${{ inputs.releaseNotes }}
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          printf '%s' "$NOTES" > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
      # Sends the bundle to the internal testing track; only listed testers get it. Production stays a manual promotion.
      - name: Upload to Play internal testing
        if: env.HAS_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: me.fealty
          releaseFiles: apps/android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: ${{ inputs.playStatus }}
          releaseName: ${{ inputs.versionName }} (${{ github.run_number }})
          whatsNewDirectory: ${{ inputs.releaseNotes != '' && format('{0}/whatsnew', runner.temp) || '' }}
      # The APK to sideload: Play's own universal APK, signed with the app signing key, so the Play Store can update it later.
      - name: Fetch Play-signed APK
        if: env.HAS_PLAY_KEY == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install --quiet google-auth requests
          mkdir -p build/apk
          python3 ../../.github/scripts/play_universal_apk.py me.fealty ${{ github.run_number }} build/apk/fealty-${{ inputs.versionName }}.apk
      - name: Upload Play-signed APK
        if: env.HAS_PLAY_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fealty-apk-${{ inputs.versionName }}-${{ github.run_number }}
          path: apps/android/build/apk/*.apk
          if-no-files-found: error
