# Temporary: renders Android screens on an emulator for the design audit. Removed before any PR.
name: Audit Android screenshots
on:
  push:
    branches: [claude/project-thread-0v7h6n]
    paths: [".audit/drive.py", ".audit/run.sh", ".github/workflows/audit-android-shots.yml"]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: obey, POSTGRES_PASSWORD: obey, POSTGRES_DB: obey }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TZ: America/Detroit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @obey/api migrate
      - name: Start API
        run: |
          (cd apps/api && DEV_AUTH=1 HOST=0.0.0.0 nohup pnpm exec tsx src/server.ts > /tmp/api.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:3000/health && break; sleep 2; done
      - name: Seed
        run: |
          REL=$(node .audit/seed.mjs | tail -1); node .audit/seed2.mjs "$REL"
          PGPASSWORD=obey psql -h localhost -U obey obey -f .audit/backfill.sql
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug -Pobey.apiBaseUrl=http://10.0.2.2:3000/
        working-directory: apps/android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./.audit/run.sh
      - name: Commit screenshots
        if: always()
        run: |
          grep -v "^$" /tmp/api.log | tail -40 || true
          cd .audit/android-shots && mogrify -resize 50% *.png || true
          cd $GITHUB_WORKSPACE
          git config user.name "audit-bot"; git config user.email "audit-bot@users.noreply.github.com"
          git add .audit/android-shots && git commit -m "Android audit screenshots" && git push origin HEAD:${GITHUB_REF_NAME}
